name: MCP CI

on:
  pull_request:
    paths:
      - 'mcp/**'
      - 'render.yaml'
      - '.github/workflows/mcp-ci.yml'
  push:
    paths:
      - 'mcp/**'
      - 'render.yaml'
      - '.github/workflows/mcp-ci.yml'

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
