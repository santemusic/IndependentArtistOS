<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Artist OS</title>
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 20px; background: #0b0b0c; color: #f5f5f5; }
    .wrap { display: grid; gap: 14px; }
    .card { background: #171719; border: 1px solid #2a2a2d; border-radius: 16px; padding: 16px; }
    .eyebrow { font-size: 12px; opacity: .6; text-transform: uppercase; letter-spacing: .08em; }
    .big { font-size: 24px; font-weight: 700; margin-top: 4px; }
    .muted { opacity: .68; }
    .top3 { margin: 10px 0 0; padding-left: 20px; }
    .row { display:flex; justify-content:space-between; gap:16px; align-items:center; }
    .pill { background:#26262a; padding:6px 10px; border-radius:999px; font-size:12px; }
    button { background:#f5f5f5; color:#111; border:0; border-radius:12px; padding:11px 14px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="eyebrow">Digital Management Office</div>
      <div class="big" id="artist">Artist OS</div>
      <div class="muted" id="stage"></div>
    </div>
    <div class="card">
      <div class="eyebrow">90-Day Goal</div>
      <div class="big" id="goal">Loading…</div>
    </div>
    <div class="card">
      <div class="row"><div class="eyebrow">This Week</div><span class="pill" id="taskCount"></span></div>
      <ol class="top3" id="top3"></ol>
    </div>
    <div class="card">
      <div class="eyebrow">Current Bottleneck</div>
      <div class="big" id="bottleneck">—</div>
    </div>
    <div class="card">
      <div class="row">
        <div>
          <div class="eyebrow">Live state</div>
          <div class="muted">Refreshes from your Music OS.</div>
        </div>
        <button id="refresh">Refresh</button>
      </div>
    </div>
  </div>

  <script>
    let rpcId = 0;
    const pending = new Map();

    function rpcNotify(method, params) {
      window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
    }

    function rpcRequest(method, params) {
      return new Promise((resolve, reject) => {
        const id = ++rpcId;
        pending.set(id, { resolve, reject });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });
    }

    function render(snapshot) {
      if (!snapshot) return;
      const a = snapshot.artist || {};
      document.getElementById("artist").textContent = a.artistName || "Your Artist";
      document.getElementById("stage").textContent = a.stage ? "Stage: " + a.stage : "";
      document.getElementById("goal").textContent = a.ninetyDayGoal || "Set your 90-day goal";
      document.getElementById("bottleneck").textContent = a.currentBottleneck || "Not set";
      document.getElementById("taskCount").textContent = (snapshot.openTasks || []).length + " open tasks";
      const list = document.getElementById("top3");
      list.innerHTML = "";
      const top3 = (a.weeklyTop3 || []).slice(0, 3);
      if (!top3.length) top3.push("Set this week's Top 3");
      top3.forEach((item) => {
        const li = document.createElement("li");
        li.textContent = item;
        list.appendChild(li);
      });
    }

    function updateFromResponse(response) {
      const payload = response?.structuredContent || response?.result?.structuredContent;
      if (payload?.snapshot) render(payload.snapshot);
    }

    window.addEventListener("message", (event) => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== "2.0") return;
      if (typeof message.id === "number") {
        const p = pending.get(message.id);
        if (!p) return;
        pending.delete(message.id);
        message.error ? p.reject(message.error) : p.resolve(message.result);
        return;
      }
      if (message.method === "ui/notifications/tool-result") updateFromResponse(message.params);
    });

    async function refresh() {
      const response = await rpcRequest("tools/call", { name: "get_operating_snapshot", arguments: {} });
      updateFromResponse(response);
    }

    async function init() {
      await rpcRequest("ui/initialize", {
        appInfo: { name: "artist-os-dashboard", version: "0.2.0" },
        appCapabilities: {},
        protocolVersion: "2026-01-26"
      });
      rpcNotify("ui/notifications/initialized", {});
      await refresh();
    }

    document.getElementById("refresh").addEventListener("click", () => refresh().catch(console.error));
    init().catch(console.error);
  </script>
</body>
</html>
