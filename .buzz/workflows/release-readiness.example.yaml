name: Release Readiness Check
trigger:
  on: message
steps:
  - id: request
    action: send_message
    channel: "#agency-release"
    message: "@release-pm Run release readiness. Verify product, distribution, content, growth, PR, rights, budget and analytics dependencies. Escalate missing human approvals."
