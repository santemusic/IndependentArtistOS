services:
  - type: web
    name: independent-artist-os-mcp
    runtime: node
    rootDir: mcp
    buildCommand: npm ci && npm test && npm run typecheck && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: MCP_PUBLIC_URL
        sync: false
      - key: NOTION_OAUTH_CLIENT_ID
        sync: false
      - key: NOTION_OAUTH_CLIENT_SECRET
        sync: false
      - key: MUSIC_OS_RUNTIME_MODE
        value: SUPERVISED
      - key: MUSIC_OS_EXTERNAL_ACTIONS
        value: APPROVAL_ONLY
